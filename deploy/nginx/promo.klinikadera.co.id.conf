# promo.klinikadera.co.id → reservasi-app (127.0.0.1:8300). The app picks the page by Host
# (server/main.ts): "/" → /11-11. Install, then let certbot add TLS:
#   sudo cp promo.klinikadera.co.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/promo.klinikadera.co.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d promo.klinikadera.co.id --redirect
server {
    listen 80;
    listen [::]:80;
    server_name promo.klinikadera.co.id;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
