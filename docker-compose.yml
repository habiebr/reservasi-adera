services:
  db:
    image: postgres:15-alpine
    container_name: reservasi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reservasi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservasi}
      POSTGRES_DB: reservasi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - reservasi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservasi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: reservasi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reservasi:${POSTGRES_PASSWORD:-reservasi}@db:5432/reservasi
    ports:
      - "127.0.0.1:${PORT:-8300}:${PORT:-8300}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - tunnel   # vaksinadera's cloudflared network → serves reservasi-staging.habiebraharjo.xyz

volumes:
  reservasi-db-data:

networks:
  # The Cloudflare Tunnel container (vaksinadera-cloudflared) lives on this network and
  # reaches the app by container name (http://reservasi-app:8300).
  tunnel:
    name: vaksinadera_internal
    external: true
