services:
  db:
    image: postgres:15-alpine
    container_name: reservasi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reservasi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservasi}
      POSTGRES_DB: reservasi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - reservasi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservasi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: reservasi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reservasi:${POSTGRES_PASSWORD:-reservasi}@db:5432/reservasi
    ports:
      - "127.0.0.1:${PORT:-8300}:${PORT:-8300}"
    depends_on:
      db:
        condition: service_healthy

  # Cloudflare Tunnel → https://reservasi-adera.habiebraharjo.xyz
  # Ingress is defined in cloudflared/config.yml (service: http://app:8300);
  # tunnel identity + credentials come from TUNNEL_TOKEN in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reservasi-cloudflared
    restart: unless-stopped
    # Only the tunnel token is injected — not the whole .env, which holds Calq/DOKU/SMTP
    # secrets that cloudflared has no business seeing. Defaulted rather than `:?` because
    # compose interpolates the whole file: a required var would also break `up -d db`.
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app

volumes:
  reservasi-db-data:
